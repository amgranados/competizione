services:
  postgres:
    image: postgres:15-alpine
    container_name: competizione-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-competizione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-competizione}
      POSTGRES_DB: ${POSTGRES_DB:-competizione}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-competizione} -d ${POSTGRES_DB:-competizione}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: competizione-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-competizione}:${POSTGRES_PASSWORD:-competizione}@postgres:5432/${POSTGRES_DB:-competizione}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-random-string-of-at-least-32-characters}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIES_SECURE: ${COOKIES_SECURE:-false}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. The browser hits the backend
        # directly at this URL, so it must be reachable from the host.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: competizione-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
