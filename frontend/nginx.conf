server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (M-04) ---
    # `always` para emitirlas también en respuestas de error.
    # CSP arrancada permisiva para no romper Vite; endurecer en despliegue real
    # (idealmente eliminar 'unsafe-inline' usando nonces/hashes). `connect-src`
    # incluye http/https/ws para permitir la llamada al backend; restríngelo al
    # origen real de la API en producción.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Long-cache hashed static assets emitted by Vite.
    location /assets/ {
        expires 1y;
        # add_header dentro de location reemplaza las heredadas: re-declarar las
        # de seguridad además de la de cacheo.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA fallback: send unknown paths to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
